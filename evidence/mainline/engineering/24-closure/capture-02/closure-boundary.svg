<path d="M400 250H465M835 250H900" stroke="#007b9c" stroke-width="3"/>
<text x="30" y="442" class="s">No automatic closure from APPLIED feedback</text>
<text x="30" y="480" class="n">A saved action report is checked against its declared named operation and authorization at the action time.</text>
<text x="30" y="538" class="n">Missing, future, copied, ambiguous or contradictory current evidence cannot satisfy the full criterion.</text>
<text x="30" y="580" class="n">Expired historical evidence stays preserved; new genuine current samples can support a renewed verification window.</text>
<text x="30" y="638" class="n">Sampled criteria do not establish continuous recovery. Other facility questions remain explicitly unevaluated.</text>
<text x="30" y="730" class="n">No plant trace or actual-state parameter is accepted. No training, LLM, policy or RSI conclusion.</text>
</svg>
