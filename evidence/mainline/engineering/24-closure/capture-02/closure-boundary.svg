<text x="481" y="167" class="s">Finite criterion review</text>
<text x="481" y="213" class="n">Post-action condition + service</text>
<text x="481" y="251" class="n">Genuine origins and time span</text>
<text x="481" y="289" class="n">Current cross-source contradictions</text>
