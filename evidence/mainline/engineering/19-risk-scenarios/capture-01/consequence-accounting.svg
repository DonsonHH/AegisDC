<rect x="280" y="198" width="247.157" height="29" fill="#007b9c"/>
<text x="920" y="219" font-size="15" fill="#24405c" font-weight="normal">0.996602 service-unit s</text>
<text x="34" y="298" font-size="17" fill="#24405c" font-weight="bold">Unserved work</text>
<rect x="280" y="276" width="372.843" height="29" fill="#b45319"/>
<text x="920" y="297" font-size="15" fill="#24405c" font-weight="normal">1.503398 service-unit s</text>
<text x="34" y="376" font-size="17" fill="#24405c" font-weight="bold">Fractional deficit time</text>
<rect x="280" y="354" width="238.926" height="29" fill="#8448a4"/>
<text x="920" y="375" font-size="15" fill="#24405c" font-weight="normal">0.963410 s</text>
<text x="34" y="455" font-size="15" fill="#24405c" font-weight="normal">The first three rows share work units. Deficit time has a different denominator and stays separate.</text>
<text x="34" y="484" font-size="15" fill="#24405c" font-weight="normal">Known joint outcomes are counted once per time window; unmodeled domain risks remain unknown.</text>
