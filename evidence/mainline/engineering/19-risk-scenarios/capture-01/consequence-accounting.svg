<rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="Arial,sans-serif">
<text x="34" y="40" font-size="25" fill="#24405c" font-weight="bold">Joint service accounting | declared 2 s law</text>
<text x="34" y="68" font-size="15" fill="#24405c" font-weight="normal">Public two-report belief at 12 s; normalized service is not FLOP/s or site-calibrated capacity</text>
<text x="34" y="142" font-size="17" fill="#24405c" font-weight="bold">Offered work</text>
<rect x="280" y="120" width="620.000" height="29" fill="#617991"/>
<text x="920" y="141" font-size="15" fill="#24405c" font-weight="normal">2.500000 service-unit s</text>
