   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle" x="432" y="29.754" transform="rotate(-0 432 29.754)">Public review and physical verification remain separate</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(77.515156 87.565164)">Private eight-domain plant</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(77.216719 100.662586)">Local automatic protection</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(359.609375 87.565164)">Arrived public records</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(345.271875 100.662586)">Source / clock / provenance</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(633.625 87.565164)">Actual question instance</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(619.440625 100.662586)">Origin / trigger / opening / slot</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(137.979375 215.273953)">Physical sampled verification</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(115.645 228.371375)">Own completed action + own recheck</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(92.427031 241.468797)">Condition AND service samples / declared span</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(584.519844 215.134891)">Management review</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(531.86125 228.232313)">Exact record + instance + valid authority</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(507.52375 241.329734)">FALSE_ALARM additionally needs original + dossier</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(109.105313 357.43232)">VERIFIED_CLOSED</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(77.30375 370.807867)">Declared evidence criteria met</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(348.174688 357.43232)">ACCEPT_RISK / FALSE_ALARM</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(347.699688 370.807867)">Management question closed</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(669.860156 357.659664)">ESCALATE</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(644.036719 370.757086)">Question stays open</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(66.610156 466.645164)">Current question status -&gt; stage gate -&gt; shared resource budget</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(88.239844 479.742586)">A past valid decision does not close the current question</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(494.620469 466.645164)">Historical projection: actual identity at public arrival clock</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(507.254062 479.742586)">Stored separately; no private truth or physical effect</text>
   </g>
  </g>
  <g id="text_12">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #405060" x="432" y="547.2" transform="rotate(-0 432 547.2)">Management dispositions: risk_closed=false; no physical-restoration claim; escalation takes precedence.</text>
  </g>
  <g id="text_13">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="432" y="567.36" transform="rotate(-0 432 567.36)">Runtime architecture for the finite 39c review slice. Engineering qualification is not a measured service gain.</text>
