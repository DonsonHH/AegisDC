   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle" x="432" y="30.834" transform="rotate(-0 432 30.834)">Public review and physical verification remain separate</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(77.515156 92.155164)">Private eight-domain plant</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(77.216719 105.252586)">Local automatic protection</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(359.609375 92.155164)">Arrived public records</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(345.271875 105.252586)">Source / clock / provenance</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(633.625 92.155164)">Actual question instance</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(619.440625 105.252586)">Origin / trigger / opening / slot</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(137.979375 227.513953)">Physical sampled verification</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(115.645 240.611375)">Own completed action + own recheck</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(92.427031 253.708797)">Condition AND service samples / declared span</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(584.519844 227.374891)">Management review</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(531.86125 240.472312)">Exact record + instance + valid authority</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(507.52375 253.569734)">FALSE_ALARM additionally needs original + dossier</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(109.105313 377.41232)">VERIFIED_CLOSED</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(77.30375 390.787867)">Declared evidence criteria met</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(348.174688 377.41232)">ACCEPT_RISK / FALSE_ALARM</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(347.699688 390.787867)">Management question closed</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(669.860156 377.639664)">ESCALATE</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(644.036719 390.737086)">Question stays open</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(66.610156 492.835164)">Current question status -&gt; stage gate -&gt; shared resource budget</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(88.239844 505.932586)">A past valid decision does not close the current question</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(494.620469 492.835164)">Historical projection: actual identity at public arrival clock</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(507.254062 505.932586)">Stored separately; no private truth or physical effect</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #405060" transform="translate(530.580625 439.02825)">All management dispositions keep risk_closed=false</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #405060" transform="translate(521.050625 448.209)">No physical-restoration claim; escalation has precedence</text>
   </g>
  </g>
  <g id="text_13">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="432" y="570.24" transform="rotate(-0 432 570.24)">Runtime architecture for the finite 39c review slice. Engineering qualification is not a measured service gain.</text>
