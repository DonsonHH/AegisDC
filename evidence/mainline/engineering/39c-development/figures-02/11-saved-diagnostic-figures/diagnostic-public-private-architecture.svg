   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #16384c" x="14.4" y="28.8" transform="rotate(-0 14.4 28.8)">Public judgements and private event evaluation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506679" x="14.4" y="61.2" transform="rotate(-0 14.4 61.2)">Architecture of the implemented diagnostic slice; separate from verified closure and causal gain.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #15374b" x="30.96" y="127.918125" transform="rotate(-0 30.96 127.918125)">Available public frame</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(30.96 159.518437)">Records + source / time / error</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(30.96 173.375703)">Declared nominal knowledge</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(30.96 187.232969)">External work order = context</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #15374b" x="344.16" y="127.918125" transform="rotate(-0 344.16 127.918125)">Public condition assessment</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(344.16 159.518437)">Qualify first, then latest sample</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(344.16 173.375703)">UNKNOWN / NORMAL / ABNORMAL</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(344.16 187.232969)">Keep observation and arrival clocks</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #15374b" x="660.96" y="127.918125" transform="rotate(-0 660.96 127.918125)">Public decision record</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(660.96 159.518437)">Sampled scalar state only</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(660.96 173.375703)">No private labels or opportunities</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(660.96 187.232969)">Repeated record is not a new event</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #15374b" x="30.96" y="351.118125" transform="rotate(-0 30.96 351.118125)">Private evaluation inputs</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(30.96 382.718437)">Exact completed-run trace</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(30.96 396.575703)">Predeclared event + state predicate</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(30.96 410.432969)">Fixed reference opportunity / window</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(30.96 424.290234)">Unknown truth stays UNKNOWN</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #15374b" x="344.16" y="351.118125" transform="rotate(-0 344.16 351.118125)">Post-run event evaluator</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(344.16 382.718437)">Compare at observation time</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(344.16 396.575703)">Count each event once</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(344.16 410.432969)">Miss / false positive / censoring</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(344.16 424.290234)">No denominator =&gt; null rate</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #15374b" x="660.96" y="351.118125" transform="rotate(-0 660.96 351.118125)">Saved endpoint table</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(660.96 382.718437)">Normal, fault, unknown all kept</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(660.96 396.575703)">No-human does not erase opportunity</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(660.96 410.432969)">Prevention effect NOT IDENTIFIED</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #345368" transform="translate(660.96 424.290234)">Original failures stay visible</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b8291" x="21.6" y="270" transform="rotate(-0 21.6 270)">PUBLIC DECISION SIDE</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #90745f" x="21.6" y="301.68" transform="rotate(-0 21.6 301.68)">PRIVATE, AFTER RUN COMPLETION</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506679" x="18" y="519.84" transform="rotate(-0 18 519.84)">No private-to-dispatch path. Engineering scope; 180 registered baseline trials remain unchanged; field calibration pending.</text>
   </g>
