<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
<rect width="100%" height="100%" fill="#f7f9fc"/>
<style>text{font-family:Arial,sans-serif;fill:#17283e}</style>
<text x="34" y="38" font-size="23" font-weight="bold">Static sparse coverage and explicit observation channels</text>
<text x="34" y="65" font-size="12">45 shared V6 entity IDs; 3 physical fixed points and 1 authorized reported-control group. This is not a health mask.</text>
<rect x="35" y="112" width="510" height="76" rx="8" fill="#dfeaf7" stroke="#7596bc"/>
<text x="52" y="139" font-size="15" font-weight="bold">immersion / coolant_temperature</text>
<text x="52" y="165" font-size="12">Declared poll 1 s; static enabled=True</text>
<path d="M545 150H615" stroke="#5279b2" stroke-width="2"/>
<rect x="615" y="112" width="740" height="76" rx="8" fill="white" stroke="#7596bc"/>
<text x="633" y="139" font-size="13">coolant_temperature, coolant_hot_reported</text>
<text x="633" y="165" font-size="12">2 transfer streams; source/model assumptions do not reveal realized errors.</text>
<rect x="35" y="232" width="510" height="76" rx="8" fill="#dfeaf7" stroke="#7596bc"/>
<text x="52" y="259" font-size="15" font-weight="bold">intake_pump / lake_mass_flow</text>
<text x="52" y="285" font-size="12">Declared poll 2 s; static enabled=True</text>
<path d="M545 270H615" stroke="#5279b2" stroke-width="2"/>
<rect x="615" y="232" width="740" height="76" rx="8" fill="white" stroke="#7596bc"/>
<text x="633" y="259" font-size="13">lake_mass_flow</text>
<text x="633" y="285" font-size="12">1 transfer streams; source/model assumptions do not reveal realized errors.</text>
<rect x="35" y="352" width="510" height="76" rx="8" fill="#dfeaf7" stroke="#7596bc"/>
<text x="52" y="379" font-size="15" font-weight="bold">rectifier / rectifier_input_power</text>
<text x="52" y="405" font-size="12">Declared poll 5 s; static enabled=True</text>
<path d="M545 390H615" stroke="#5279b2" stroke-width="2"/>
<rect x="615" y="352" width="740" height="76" rx="8" fill="white" stroke="#7596bc"/>
<text x="633" y="379" font-size="13">rectifier_input_power</text>
<text x="633" y="405" font-size="12">1 transfer streams; source/model assumptions do not reveal realized errors.</text>
<rect x="35" y="472" width="510" height="76" rx="8" fill="#dfeaf7" stroke="#7596bc"/>
<text x="52" y="499" font-size="15" font-weight="bold">local_controller / controller_temperature</text>
<text x="52" y="525" font-size="12">Declared poll 1 s; static enabled=True</text>
<path d="M545 510H615" stroke="#5279b2" stroke-width="2"/>
<rect x="615" y="472" width="740" height="76" rx="8" fill="white" stroke="#7596bc"/>
<text x="633" y="499" font-size="13">controller_reported_temperature, controller_reported_validity</text>
<text x="633" y="525" font-size="12">2 transfer streams; source/model assumptions do not reveal realized errors.</text>
<text x="35" y="618" font-size="13">Other catalogued entities are not automatically observed. Raw/threshold packets of one probe share a measurement root.</text>
</svg>
