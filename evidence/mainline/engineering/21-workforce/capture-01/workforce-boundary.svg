<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350">
<style>text{font-family:Arial,sans-serif;fill:#162b42}.t{font-size:24px;font-weight:bold}.h{font-size:18px;font-weight:bold}.b{font-size:15px}</style>
<rect width="1080" height="350" fill="#f7f9fc"/>
<text x="30" y="40" class="t">Timed work intentions | public and private boundary</text>
<rect x="30" y="90" width="300" height="180" fill="white" stroke="#aabbce"/>
<text x="46" y="120" class="h">Current public preparation</text>
<text x="46" y="153" class="b">Current frame + static profile</text>
<text x="46" y="183" class="b">Qualifications / tools / reports</text>
<text x="46" y="213" class="b">One intention, no future program</text>
<text x="46" y="243" class="b">Execution permission remains false</text>
<rect x="390" y="90" width="300" height="180" fill="white" stroke="#aabbce"/>
<text x="406" y="120" class="h">Private plant and resources</text>
<text x="406" y="153" class="b">Queue / tool pickup / gate check</text>
<text x="406" y="183" class="b">Crew rendezvous / timed work</text>
<text x="406" y="213" class="b">Local protection uses actual state</text>
<text x="406" y="243" class="b">Travel / wait / work stay separate</text>
<rect x="750" y="90" width="300" height="180" fill="white" stroke="#aabbce"/>
<text x="766" y="120" class="h">Declared public feedback</text>
<text x="766" y="153" class="b">Task-local observed result</text>
<text x="766" y="183" class="b">Available after declared latency</text>
<text x="766" y="213" class="b">No early actual-resource query</text>
<text x="766" y="243" class="b">No repair or measurement invented</text>
<path d="M330 180H390M690 180H750" stroke="#007b9c" stroke-width="3"/>
<text x="30" y="312" class="b">Same eight-domain plant and four relation graphs. Private traces never become dispatcher input.</text>
<text x="30" y="337" class="b">Engineering execution only; inspection observations, intervention and method comparisons remain later gates.</text>
</svg>
