<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img">
<title>Ticket 18 public evidence and belief boundary</title>
<desc>Architecture of the bounded synthetic facility belief model. Plant state remains private. Public records and declared assumptions produce posterior beliefs without a physical repair.</desc>
<rect width="1200" height="660" fill="#f7f9fc"/>
<style>text{font-family:Arial,sans-serif;fill:#162b42}.title{font-size:26px;font-weight:bold}.heading{font-size:19px;font-weight:bold}.body{font-size:16px}.note{font-size:15px;fill:#456079}.box{fill:white;stroke:#adbdcf;stroke-width:1.5}.arrow{stroke:#007b9c;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#007b9c"/></marker></defs>
<text x="36" y="42" class="title">Public evidence → bounded belief → later risk decisions</text>
<text x="36" y="72" class="note">Zhengzhou-inspired synthetic eight-domain facility · engineering architecture · field calibration pending</text>
<rect x="35" y="105" width="255" height="170" rx="9" fill="#e8edf4" stroke="#adbdcf"/>
<text x="55" y="138" class="heading">Private plant / evaluator</text>
<text x="55" y="170" class="body">Actual state and fault history</text>
<text x="55" y="198" class="body">Existing local protection</text>
<text x="55" y="240" class="note">No direct input to belief</text>
<rect x="35" y="315" width="255" height="225" rx="9" class="box"/>
<text x="55" y="349" class="heading">Available public records</text>
<text x="55" y="383" class="body">Sparse fixed measurements</text>
<text x="55" y="412" class="body">History, reports, work orders</text>
<text x="55" y="441" class="body">Onsite handheld results</text>
<text x="55" y="481" class="note">Observation + arrival + expiry</text>
<text x="55" y="506" class="note">Shared origin / copy identity</text>
<rect x="340" y="315" width="245" height="225" rx="9" class="box"/>
<text x="360" y="349" class="heading">Validated public frame</text>
<text x="360" y="383" class="body">Only records available now</text>
<text x="360" y="412" class="body">Declared static knowledge</text>
<text x="360" y="455" class="note">Registered source / unit checks</text>
<text x="360" y="484" class="note">Copy / correlation / conflict audit</text>
<text x="360" y="513" class="note">Unresolved reports stay visible</text>
<rect x="630" y="105" width="250" height="170" rx="9" class="box"/>
<text x="650" y="138" class="heading">Declared model assumptions</text>
<text x="650" y="170" class="body">Prior and state evolution</text>
<text x="650" y="198" class="body">Likelihood + sensitivity variants</text>
<text x="650" y="240" class="note">Finite scope and independence</text>
<rect x="630" y="315" width="250" height="225" rx="9" class="box"/>
<text x="650" y="349" class="heading">Exact finite filtering</text>
<text x="650" y="383" class="body">Admit usable representatives</text>
<text x="650" y="412" class="body">Update observation epoch</text>
<text x="650" y="441" class="body">Project to decision time</text>
<text x="650" y="481" class="note">Copies add no likelihood factor</text>
<text x="650" y="510" class="note">Empty records project the prior</text>
<rect x="930" y="315" width="235" height="225" rx="9" class="box"/>
<text x="950" y="349" class="heading">Belief + audit</text>
<text x="950" y="383" class="body">Posterior by modeled cause</text>
<text x="950" y="412" class="body">Model envelope / support</text>
<text x="950" y="441" class="body">Unidentified causes / conflicts</text>
<text x="950" y="481" class="note">Physical actions remain empty</text>
<text x="950" y="510" class="note">Risk / action: tickets19–20</text>
<path d="M290,425H337" class="arrow"/><path d="M585,425H627" class="arrow"/><path d="M755,275V312" class="arrow"/><path d="M880,425H927" class="arrow"/>
