<text x="908" y="139" font-size="16" font-weight="bold">Pure consumer: current JSON frame</text>
<text x="50" y="171" font-size="14" >No current parameter overrides or events</text>
<text x="50" y="205" font-size="13" >physical: 43 relations</text>
<text x="50" y="234" font-size="13" >functional: 23 relations</text>
<text x="50" y="263" font-size="13" >control_information: 20 relations</text>
<text x="50" y="292" font-size="13" >access: 5 relations; 5 bidirectional</text>
<text x="494" y="171" font-size="14" >11 sources; 9 observables</text>
<text x="494" y="205" font-size="14" >6 fixed public ticks per stream</text>
<text x="494" y="239" font-size="14" >Only evaluator advances next_frame()</text>
<text x="494" y="273" font-size="14" >Sparse records retain time and provenance</text>
<text x="494" y="307" font-size="14" >No consumer future-time query handle</text>
<text x="908" y="171" font-size="14" >3 predeclared preparation intentions</text>
<text x="908" y="205" font-size="14" >decision_options(frame)</text>
<text x="908" y="239" font-size="14" >public_feasibility(frame, request_id)</text>
<text x="908" y="273" font-size="14" >Nominal capability + current report mask</text>
<text x="908" y="307" font-size="14" >No execution permission or plant object</text>
