<text x="50" y="424" font-size="16" font-weight="bold">PRIVATE EVALUATOR / PLANT: actual state, local automatic protection, real access and private work occupation</text>
<text x="50" y="458" font-size="14" >2 distinct full-facility runs + 6 isolated public-input CLI traces; no world object is a consumer argument.</text>
<text x="50" y="492" font-size="14" >No automatic state-to-record or rejection-to-report path. Tickets 16/17 and later execution must declare an observation channel and arrival time.</text>
<text x="50" y="520" font-size="13" >Saved plant runs and accumulated hindsight traces are evaluator artifacts, rejected by the current-frame consumer interface.</text>
