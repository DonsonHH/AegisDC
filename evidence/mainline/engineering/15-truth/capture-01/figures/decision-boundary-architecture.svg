<text x="32" y="40" font-size="24" font-weight="bold">One facility identity; separate evaluator and consumer inputs</text>
<text x="32" y="67" font-size="13" class="muted">45 canonical V6 entities; 8 operational domains; 4 relation graphs. Counts come from the delivered inputs/results.</text>
