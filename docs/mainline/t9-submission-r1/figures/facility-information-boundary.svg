<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 428" width="960" height="428" role="img" aria-labelledby="title desc">
<title id="title">到时证据、合法作业和窗末评价的边界</title>
<desc id="desc">可到达记录进入在线决策，决策最多发一个请求。执行器检验硬约束后推动耦合设施。只有到达的具名回执或观测返回策略。窗末评价读真实需求与交付，研究后的搜索仅取得本臂已经付费的聚合分。</desc>
<defs>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#146286"/></marker>
  <marker id="dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#495866"/></marker>
  <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif;fill:#172d38}.cap{font-size:18px;font-weight:bold}.head{font-size:19px;font-weight:bold}.body{font-size:15px}.label{font-size:13px;fill:#415866}.flow{fill:none;stroke-width:2.4;stroke-linejoin:round}.cell{fill:white;stroke-width:1.4}</style>
</defs>
<rect x="1" y="1" width="958" height="426" rx="10" fill="#fff" stroke="#d4dde2"/>
<rect x="9" y="10" width="942" height="112" rx="7" fill="#e8f3f7"/>
<rect x="9" y="154" width="942" height="112" rx="7" fill="#f1f3f4"/>
<rect x="9" y="301" width="942" height="116" rx="7" fill="#edf5f1"/>
<g text-anchor="middle">
  <text x="76" y="64" class="cap">在线策略</text><text x="76" y="89" class="label">仅见公开视图</text>
  <text x="76" y="206" class="cap">设施与执行</text><text x="76" y="231" class="label">私有真值</text>
  <text x="76" y="353" class="cap">窗末评价</text><text x="76" y="378" class="label">整窗配对</text>
</g>
<g class="cell" stroke="#87acbd">
  <rect x="145" y="23" width="316" height="83" rx="5"/><rect x="574" y="23" width="355" height="83" rx="5"/>
</g>
<g class="cell" stroke="#a1adb4">
  <rect x="145" y="168" width="316" height="84" rx="5"/><rect x="574" y="168" width="355" height="84" rx="5"/>
</g>
<g class="cell" stroke="#8ba99c">
  <rect x="145" y="316" width="316" height="84" rx="5"/><rect x="574" y="316" width="355" height="84" rx="5"/>
</g>
<g>
  <text x="160" y="48" class="head">到时证据</text>
  <text x="160" y="72" class="body">工单、稀疏测点、自己的现场读数</text><text x="160" y="93" class="body">核对来源、有效期、执行身份与版本</text>
  <text x="589" y="48" class="head">决策与首步选择</text>
  <text x="589" y="72" class="body">复核义务优先，再比较等待、初检和处置</text><text x="589" y="93" class="body">同一可能读数共用一项后续计划</text>
  <text x="589" y="194" class="head">实际准入与作业</text>
  <text x="589" y="218" class="body">许可、通行、工种、工具、班次、作业窗</text><text x="589" y="240" class="body">拒绝、无效或未完成均按原样留存</text>
  <text x="160" y="194" class="head">耦合设施与本地保护</text>
  <text x="160" y="218" class="body">供电、后备、冷却、计算／网络／存储</text><text x="160" y="240" class="body">外生扰动、需求与实际服务交付</text>
  <text x="160" y="342" class="head">评价端独立计量</text>
  <text x="160" y="366" class="body">从需求和实际交付积分服务缺额 L</text><text x="160" y="388" class="body">工时、费用、违规与有效关闭分列</text>
  <text x="589" y="342" class="head">离线搜索的反馈范围</text>
  <text x="589" y="366" class="body">T8 仅用共同父或本臂已付的聚合分</text><text x="589" y="388" class="body">程序更新发生在轮间</text>
</g>
<g stroke="#146286" class="flow" marker-end="url(#blue)">
  <path d="M462 75H569"/><path d="M748 106V164"/><path d="M285 167V111"/>
</g>
<g stroke="#495866" class="flow" marker-end="url(#dark)">
  <path d="M573 224H466"/><path d="M285 252V311"/><path d="M462 367H569"/>
</g>
<g class="label">
  <text x="518" y="63" text-anchor="middle">更新后验</text>
  <text x="761" y="141">一次请求或暂缓</text>
  <text x="298" y="141">合法到达的消息</text>
  <text x="518" y="211" text-anchor="middle">执行效果</text>
  <text x="298" y="288">原生轨迹</text>
  <text x="518" y="355" text-anchor="middle">聚合回执</text>
</g>
</svg>
