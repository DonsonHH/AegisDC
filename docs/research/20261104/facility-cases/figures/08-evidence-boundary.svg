<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" role="img" aria-labelledby="title-08-evidence-boundary desc-08-evidence-boundary">
<title id="title-08-evidence-boundary">物理状态、局部自动控制与巡检证据</title>
<desc id="desc-08-evidence-boundary">上排画现场的物理与保护，下排画巡检工作。两者通过可追溯证据连接，不把仿真真值直接交给任务选择器。</desc>
<defs>
<marker id="arrow-08-evidence-boundary-power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#355ab0"/></marker>
<marker id="arrow-08-evidence-boundary-heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bd4c37"/></marker>
<marker id="arrow-08-evidence-boundary-fluid" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#20788b"/></marker>
<marker id="arrow-08-evidence-boundary-signal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b662e"/></marker>
<marker id="arrow-08-evidence-boundary-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#865698"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif} .edge-label{font-size:12px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style>
<text x="32" y="37" font-size="23" font-weight="700" fill="#142938">物理状态、局部自动控制与巡检证据</text>
<text x="32" y="65" font-size="15" fill="#536471">本研究的接口提议；允许稀疏固定测点，巡检者只使用决策时已取得的证据。</text>
<path data-edge="0" data-status="assumption" data-from="physical" data-to="local" d="M278,176.0 L342,176.0" fill="none" stroke="#8b662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-08-evidence-boundary-signal)"><title>局部反馈 · 研究提议 · </title></path>
<path data-edge="1" data-status="assumption" data-from="local" data-to="physical" d="M465.0,227 L465,250 L310,250 L310,335 L155,335 L155.0,227" fill="none" stroke="#865698" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-08-evidence-boundary-control)"><title>本地动作 · 研究提议 · </title></path>
<path data-edge="2" data-status="assumption" data-from="physical" data-to="fixed" d="M155.0,125 L155,100 L775,100 L775.0,125" fill="none" stroke="#8b662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-08-evidence-boundary-signal)"><title>有限可测输出 · 研究提议 · </title></path>
