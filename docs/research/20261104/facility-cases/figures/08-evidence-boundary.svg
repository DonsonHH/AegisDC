<path data-edge="4" data-status="assumption" data-from="offline" data-to="knowledge" d="M155.0,492 L155,565 L1224,565 L1224,176 L1208,176.0" fill="none" stroke="#8b662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-08-evidence-boundary-signal)"><title>已取得的记录 · 研究提议 · </title></path>
<path data-edge="5" data-status="assumption" data-from="portable" data-to="knowledge" d="M465.0,390 L465,280 L1085,280 L1085.0,227" fill="none" stroke="#8b662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-08-evidence-boundary-signal)"><title>新增现场证据 · 研究提议 · </title></path>
