<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" role="img" aria-labelledby="title-07-state-coupling desc-07-state-coupling">
<title id="title-07-state-coupling">从设施拓扑到状态方程</title>
<desc id="desc-07-state-coupling">按电、水、热、服务逐层读，再沿下排找每一层的输入和未知量。这样能看清一个缺值究竟挡住哪一步。</desc>
<defs>
<marker id="arrow-07-state-coupling-power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#355ab0"/></marker>
<marker id="arrow-07-state-coupling-heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bd4c37"/></marker>
<marker id="arrow-07-state-coupling-fluid" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#20788b"/></marker>
<marker id="arrow-07-state-coupling-signal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b662e"/></marker>
<marker id="arrow-07-state-coupling-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#865698"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif} .edge-label{font-size:12px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style>
<text x="32" y="37" font-size="23" font-weight="700" fill="#142938">从设施拓扑到状态方程</text>
<text x="32" y="65" font-size="15" fill="#536471">整图为本研究提出的建模组织；设备系数、模式阈值和输入时序逐站闭合。</text>
<path data-edge="0" data-status="assumption" data-from="power" data-to="flow" d="M278,181.0 L342,181.0" fill="none" stroke="#355ab0" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-07-state-coupling-power)"><title>泵/执行器供电 · 研究提议 · </title></path>
<path data-edge="1" data-status="assumption" data-from="flow" data-to="heat" d="M588,181.0 L652,181.0" fill="none" stroke="#20788b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-07-state-coupling-fluid)"><title>流量影响换热 · 研究提议 · </title></path>
<path data-edge="2" data-status="assumption" data-from="heat" data-to="service" d="M898,181.0 L962,181.0" fill="none" stroke="#8b662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-07-state-coupling-signal)"><title>局部保护边界 · 研究提议 · </title></path>
<path data-edge="3" data-status="assumption" data-from="environment" data-to="power" d="M155.0,390 L155.0,232" fill="none" stroke="#8b662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-07-state-coupling-signal)"><title>边界输入 · 研究提议 · </title></path>
<path data-edge="4" data-status="assumption" data-from="faults" data-to="flow" d="M465.0,390 L465.0,232" fill="none" stroke="#8b662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-07-state-coupling-signal)"><title>K变化 · 研究提议 · </title></path>
<path data-edge="5" data-status="assumption" data-from="balance" data-to="heat" d="M775.0,390 L775.0,232" fill="none" stroke="#8b662e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-07-state-coupling-signal)"><title>守恒审计 · 研究提议 · </title></path>
<g data-node="power" data-status="assumption"><title>电气边界 / P、V、损耗 / 可供电量 / 功率守恒 / 母线储能 · 研究提议 · </title>
<rect x="32" y="130" width="246" height="102" rx="10" fill="#fff5e8" stroke="#a36324" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="47" y="151" font-size="11.5" font-weight="700" fill="#a36324">研究提议</text>
<text x="46" y="175" font-size="17.00" font-weight="650" fill="#243644">电气边界</text>
<text x="46" y="198" font-size="14.70" font-weight="400" fill="#243644">P、V、损耗 / 可供电量</text>
<text x="46" y="221" font-size="14.70" font-weight="400" fill="#243644">功率守恒 / 母线储能</text>
</g>
<g data-node="flow" data-status="assumption"><title>水力网络 / q、Δp、泵速、阀位 / 质量守恒 / 泵阀曲线 · 研究提议 · </title>
