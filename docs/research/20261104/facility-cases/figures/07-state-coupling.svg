<text x="357" y="151" font-size="11.5" font-weight="700" fill="#a36324">研究提议</text>
<text x="356" y="175" font-size="17.00" font-weight="650" fill="#243644">水力网络</text>
<text x="356" y="198" font-size="14.70" font-weight="400" fill="#243644">q、Δp、泵速、阀位</text>
<text x="356" y="221" font-size="14.70" font-weight="400" fill="#243644">质量守恒 / 泵阀曲线</text>
</g>
<g data-node="heat" data-status="assumption"><title>热与相变状态 / T、U、M、液位、p / 能量 / 相平衡 / 库存 · 研究提议 · </title>
<rect x="652" y="130" width="246" height="102" rx="10" fill="#fff5e8" stroke="#a36324" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="667" y="151" font-size="11.5" font-weight="700" fill="#a36324">研究提议</text>
<text x="666" y="175" font-size="17.00" font-weight="650" fill="#243644">热与相变状态</text>
<text x="666" y="198" font-size="14.70" font-weight="400" fill="#243644">T、U、M、液位、p</text>
<text x="666" y="221" font-size="14.70" font-weight="400" fill="#243644">能量 / 相平衡 / 库存</text>
</g>
<g data-node="service" data-status="assumption"><title>IT服务与局部保护 / 正常 / 降载 / 停止 / 阈值与恢复规则待补 · 研究提议 · </title>
<rect x="962" y="130" width="246" height="102" rx="10" fill="#fff5e8" stroke="#a36324" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="977" y="151" font-size="11.5" font-weight="700" fill="#a36324">研究提议</text>
<text x="976" y="175" font-size="17.00" font-weight="650" fill="#243644">IT服务与局部保护</text>
<text x="976" y="198" font-size="14.70" font-weight="400" fill="#243644">正常 / 降载 / 停止</text>
<text x="976" y="221" font-size="14.70" font-weight="400" fill="#243644">阈值与恢复规则待补</text>
</g>
<g data-node="environment" data-status="assumption"><title>外部输入与初值 / 负荷、湿球/湖水、供电 / 带时标，不拿峰值替代 · 研究提议 · </title>
<rect x="32" y="390" width="246" height="102" rx="10" fill="#fff5e8" stroke="#a36324" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="47" y="411" font-size="11.5" font-weight="700" fill="#a36324">研究提议</text>
<text x="46" y="435" font-size="17.00" font-weight="650" fill="#243644">外部输入与初值</text>
<text x="46" y="458" font-size="14.70" font-weight="400" fill="#243644">负荷、湿球/湖水、供电</text>
<text x="46" y="481" font-size="14.70" font-weight="400" fill="#243644">带时标，不拿峰值替代</text>
</g>
<g data-node="faults" data-status="assumption"><title>劣化/维护参数 / 过滤K、换热UA、泄漏 / 过程与故障率待标定 · 研究提议 · </title>
<rect x="342" y="390" width="246" height="102" rx="10" fill="#fff5e8" stroke="#a36324" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="357" y="411" font-size="11.5" font-weight="700" fill="#a36324">研究提议</text>
<text x="356" y="435" font-size="17.00" font-weight="650" fill="#243644">劣化/维护参数</text>
<text x="356" y="458" font-size="14.70" font-weight="400" fill="#243644">过滤K、换热UA、泄漏</text>
<text x="356" y="481" font-size="14.70" font-weight="400" fill="#243644">过程与故障率待标定</text>
</g>
<g data-node="balance" data-status="assumption"><title>边界能量审计 / 设备输入 − 环境排热 / = 储能变化 + 边界损失 · 研究提议 · </title>
<rect x="652" y="390" width="246" height="102" rx="10" fill="#fff5e8" stroke="#a36324" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="667" y="411" font-size="11.5" font-weight="700" fill="#a36324">研究提议</text>
<text x="666" y="435" font-size="17.00" font-weight="650" fill="#243644">边界能量审计</text>
<text x="666" y="458" font-size="14.70" font-weight="400" fill="#243644">设备输入 − 环境排热</text>
<text x="666" y="481" font-size="14.70" font-weight="400" fill="#243644">= 储能变化 + 边界损失</text>
</g>
<g data-node="missing" data-status="missing"><title>未闭合项优先补齐 / 拓扑 → 物性 → 时序 / 再求解与独立验证 · 待补数据 · </title>
