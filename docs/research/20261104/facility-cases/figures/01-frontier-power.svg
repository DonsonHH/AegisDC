<title id="title-01-frontier-power">Frontier：电能怎样到达计算与辅机</title>
<desc id="desc-01-frontier-power">顺着上方蓝线读供电级次；再看下方辅机是否与IT共享电源。共享失效域需要单线图，不能只凭设备都在同一园区判定。</desc>
