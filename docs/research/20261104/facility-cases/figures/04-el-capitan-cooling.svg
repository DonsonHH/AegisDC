<title id="title-04-el-capitan-cooling">El Capitan：两类介质与共享排热</title>
<desc id="desc-04-el-capitan-cooling">先读顶部的功能排热链，再看两类介质如何映射到a/b侧这一待补问题。没有带端口的P&amp;ID，就先保留功能侧命名。</desc>
