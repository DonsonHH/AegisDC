<title id="title-02-frontier-cooling">Frontier：三回路、两级换热与旁路</title>
<desc id="desc-02-frontier-cooling">先沿热箭头从机柜读到大气；再逐个看下方闭环。CDU与EHX各自把两种流体隔开，传递热量而不传递质量。</desc>
