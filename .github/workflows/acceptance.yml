name: Core and evidence acceptance

on:
  push:
    branches: [main, 'donson/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install minimal project
        run: python -m pip install -e .
      - name: Verify core and historical evidence
        run: python -m patrol_rsi verify --output runs/ci
      - name: Read project status
        run: python -m aegis_dc status
      - name: Check facility structure and synthetic risk method
        run: |
          python -m aegis_dc foundation
          python -m aegis_dc risk-demo
      - name: Verify three facility case reading pack
        run: python scripts/verify_facility_cases.py
