[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renly-patrol-rsi"
version = "0.2.0"
description = "A maintainable, constrained facility-patrol workflow research core"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]
readme = "README.md"

[project.optional-dependencies]
neural = ["torch>=2.6,<2.7"]

[project.scripts]
aegis-dc = "aegis_dc.__main__:main"
patrol-rsi = "patrol_rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
