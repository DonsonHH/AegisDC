<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 355" role="img" aria-labelledby="fifo-cycle-title fifo-cycle-description" data-chart="fifo-cycle">
<title id="fifo-cycle-title">FIFO在本巡检程序中的完整决策循环</title>
<desc id="fifo-cycle-description">正在移动或测量时不打断。完成后只在本执行者负责的合规请求中先到先处理；无合法事件则继续例行任务。每次完成后重新筛选，不是固定返回时间表。</desc>
<style>svg text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}svg{background:white}</style>
<text x="18" y="32" font-size="29" fill="#172d3b" text-anchor="start" font-weight="650" >每名巡检员完成上一项检查后，再决定下一项</text>
<rect x="18" y="76" width="195" height="82" fill="#f2f6f9" rx="3"/>
<text x="115.5" y="107" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >先看本人的任务</text>
<text x="115.5" y="136" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >原定下一项＋风险请求</text>
<line x1="217" y1="116" x2="250" y2="116" stroke="#526675" stroke-width="2" /><path d="M242,121 L250,116 L242,111" fill="none" stroke="#526675" stroke-width="2"/>
<rect x="260" y="76" width="245" height="82" fill="#f2f6f9" rx="3"/>
<text x="382.5" y="107" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >筛出当下能执行的</text>
<text x="382.5" y="136" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >资格、所属、预约、期限、预算</text>
<line x1="509" y1="116" x2="545" y2="116" stroke="#526675" stroke-width="2" /><path d="M537,121 L545,116 L537,111" fill="none" stroke="#526675" stroke-width="2"/>
<rect x="555" y="76" width="290" height="82" fill="#f2f6f9" rx="3"/>
<text x="700" y="107" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >有合法风险请求：FIFO</text>
<text x="700" y="136" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >选择最早进入待办的一条</text>
<line x1="849" y1="116" x2="885" y2="116" stroke="#526675" stroke-width="2" /><path d="M877,121 L885,116 L877,111" fill="none" stroke="#526675" stroke-width="2"/>
<rect x="895" y="76" width="350" height="82" fill="#f2f6f9" rx="3"/>
<text x="1070" y="107" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >移动＋服务，完成专业测量</text>
<text x="1070" y="136" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >无论正常或告警，都更新记录</text>
<line x1="383" y1="159" x2="383" y2="210" stroke="#526675" stroke-width="2" />
<line x1="383" y1="210" x2="1070" y2="210" stroke="#526675" stroke-width="2" /><path d="M1062,215 L1070,210 L1062,205" fill="none" stroke="#526675" stroke-width="2"/>
<line x1="1070" y1="210" x2="1070" y2="159" stroke="#526675" stroke-width="2" />
<text x="710" y="201" font-size="23" fill="#526675" text-anchor="middle" font-weight="400" >没有合法风险请求：继续原定下一项</text>
<path d="M1070,159 V284 H112 V159" fill="none" stroke="#2369a5" stroke-width="2"/>
<text x="612" y="276" font-size="23" fill="#2369a5" text-anchor="middle" font-weight="400" >完成后重新规划；可以继续加查，也可以回到原循环</text>
<text x="18" y="333" font-size="22" fill="#526675" text-anchor="start" font-weight="400" >临时加查不删掉原任务；原定下一项真正完成后才继续。一次测量可以同时确认风险并完成原任务。</text>
</svg>
