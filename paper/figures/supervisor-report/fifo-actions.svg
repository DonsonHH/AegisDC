<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 307" role="img" aria-labelledby="fifo-actions-title fifo-actions-description" data-chart="fifo-actions">
<title id="fifo-actions-title">巡检员0从470秒起的实际派单与完成记录</title>
