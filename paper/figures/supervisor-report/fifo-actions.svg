<text x="1103.12" y="52" font-size="22" fill="#b63f50" text-anchor="middle" font-weight="600" >545秒截止</text>
<line x1="100" y1="209" x2="1170" y2="209" stroke="#7b8791" stroke-width="2" />
<line x1="100" y1="209" x2="100" y2="215" stroke="#7b8791" stroke-width="2" />
<text x="100" y="243" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >470</text>
<line x1="501.25" y1="209" x2="501.25" y2="215" stroke="#7b8791" stroke-width="2" />
<text x="501.25" y="243" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >500</text>
<line x1="701.875" y1="209" x2="701.875" y2="215" stroke="#7b8791" stroke-width="2" />
<text x="701.875" y="243" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >515</text>
<line x1="1036.25" y1="209" x2="1036.25" y2="215" stroke="#7b8791" stroke-width="2" />
<text x="1036.25" y="243" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >540</text>
