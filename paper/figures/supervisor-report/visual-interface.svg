<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" role="img" aria-labelledby="visual-interface-title visual-interface-description" data-chart="visual-interface">
<title id="visual-interface-title">电气图像参考与合格接点测量的分层接入图</title>
<desc id="visual-interface-description">Renly已经登记未校准图像参考元数据，并由合成合格接点量测更新温度。生成模型、像素解析、热点任务映射和真实仪器待连接。</desc>
<style>svg text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}svg{background:white}</style>
<text x="18" y="32" font-size="29" fill="#172d3b" text-anchor="start" font-weight="650" >电气视觉支路：已有成果、参考入口与数值测量的连接</text>
<text x="18" y="67" font-size="22" fill="#526675" text-anchor="start" font-weight="400" >实线表示现有量测更新；虚线表示待接入的数据或任务桥接。</text>
<rect x="18" y="102" width="290" height="88" fill="#f2f6f9" rx="3"/>
<text x="163" y="133" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >RGB→IR外观生成</text>
<text x="163" y="162" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >已有独立PID项目材料</text>
<rect x="390" y="102" width="340" height="88" fill="#f2f6f9" rx="3"/>
<text x="560" y="133" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >外观参考元数据入口</text>
<text x="560" y="162" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >Renly已有登记接口</text>
<rect x="830" y="102" width="410" height="88" fill="#f2f6f9" rx="3"/>
<text x="1035" y="133" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >热点候选与任务关联</text>
<text x="1035" y="162" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >待连接到巡检调度</text>
<line x1="314" y1="145" x2="376" y2="145" stroke="#7b8791" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="744" y1="145" x2="816" y2="145" stroke="#7b8791" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M1035,194 V238 H180 V277" fill="none" stroke="#7d8d98" stroke-width="2" stroke-dasharray="6 5"/>
<text x="580" y="227" font-size="21" fill="#526675" text-anchor="middle" font-weight="400" >视觉选点与专业复核任务之间的桥接</text>
<rect x="18" y="282" width="350" height="88" fill="#f2f6f9" rx="3"/>
<text x="193" y="313" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >合格电气接点量测</text>
<text x="193" y="342" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >当前合成专业通道，单位°C</text>
<rect x="520" y="282" width="340" height="88" fill="#f2f6f9" rx="3"/>
<text x="690" y="313" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >接点温度观测更新</text>
<text x="690" y="342" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >T̂contact ← 合格量测</text>
<rect x="950" y="282" width="290" height="88" fill="#f2f6f9" rx="3"/>
<text x="1095" y="313" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >风险与专业确认</text>
<text x="1095" y="342" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >按现有任务判据评价</text>
<line x1="380" y1="326" x2="505" y2="326" stroke="#2369a5" stroke-width="2" /><path d="M497,331 L505,326 L497,321" fill="none" stroke="#2369a5" stroke-width="2"/>
<line x1="872" y1="326" x2="936" y2="326" stroke="#2369a5" stroke-width="2" /><path d="M928,331 L936,326 L928,321" fill="none" stroke="#2369a5" stroke-width="2"/>
<text x="18" y="422" font-size="22" fill="#526675" text-anchor="start" font-weight="400" >图像提供外观线索；温度进入已有量测通道。真实仪器、生成推理与任务选点按接口逐步接入。</text>
</svg>
