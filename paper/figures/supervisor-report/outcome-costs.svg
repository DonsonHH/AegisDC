<text x="98.9091" y="259" font-size="18" fill="#526675" text-anchor="middle" font-weight="400" >1</text>
<line x1="159.818" y1="230" x2="159.818" y2="236" stroke="#7b8791" stroke-width="2" />
<text x="159.818" y="259" font-size="18" fill="#526675" text-anchor="middle" font-weight="400" >2</text>
<line x1="220.727" y1="230" x2="220.727" y2="236" stroke="#7b8791" stroke-width="2" />
<text x="220.727" y="259" font-size="18" fill="#526675" text-anchor="middle" font-weight="400" >3</text>
