<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 445" role="img" aria-labelledby="outcome-costs-title outcome-costs-description" data-chart="outcome-costs">
<title id="outcome-costs-title">FIFO相对固定巡回的净确认、移动代价和完成量代价</title>
<desc id="outcome-costs-description">每过程净增3.50段，探索性95%自举区间2.42到4.50；移动增加约0.50%，完成量下降约0.33%；门槛依次为至少1段、不超过5%、不超过2%。违规为0。</desc>
<style>svg text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}svg{background:white}</style>
<text x="18" y="32" font-size="29" fill="#172d3b" text-anchor="start" font-weight="650" >收益与代价：实际结果放回预先约定的探索性门槛</text>
<text x="18" y="66" font-size="22" fill="#526675" text-anchor="start" font-weight="400" >三个小图使用各自单位与刻度；蓝色为实际结果，金色虚线为研究决策门槛。</text>
<text x="18" y="115" font-size="26" fill="#172d3b" text-anchor="start" font-weight="600" >每过程净增确认</text>
<text x="18" y="151" font-size="21" fill="#526675" text-anchor="start" font-weight="400" >段／过程，越高越好</text>
<line x1="38" y1="230" x2="373" y2="230" stroke="#dce4e9" stroke-width="2" />
<line x1="98.9091" y1="178" x2="98.9091" y2="241" stroke="#b27420" stroke-width="2" stroke-dasharray="5 4"/>
<text x="98.9091" y="294" font-size="20" fill="#b27420" text-anchor="middle" font-weight="400" >至少1段</text>
<text x="18" y="339" font-size="25" fill="#2369a5" text-anchor="start" font-weight="650" >实际 3.50段／过程</text>
<line x1="185.197" y1="207" x2="312.091" y2="207" stroke="#2369a5" stroke-width="3" />
<line x1="185.197" y1="201" x2="185.197" y2="213" stroke="#2369a5" stroke-width="2" />
<line x1="312.091" y1="201" x2="312.091" y2="213" stroke="#2369a5" stroke-width="2" />
<circle cx="251.182" cy="207" r="7" fill="#2369a5" />
<g data-cost-key="net_confirmations" data-value="3.5" data-threshold="1"></g>
<line x1="38" y1="230" x2="38" y2="236" stroke="#7b8791" stroke-width="2" />
<text x="38" y="259" font-size="18" fill="#526675" text-anchor="middle" font-weight="400" >0</text>
