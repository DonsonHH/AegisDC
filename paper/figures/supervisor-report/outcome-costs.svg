<text x="898" y="259" font-size="18" fill="#526675" text-anchor="middle" font-weight="400" >0</text>
<line x1="974.136" y1="230" x2="974.136" y2="236" stroke="#7b8791" stroke-width="2" />
<text x="974.136" y="259" font-size="18" fill="#526675" text-anchor="middle" font-weight="400" >0.5</text>
<line x1="1050.27" y1="230" x2="1050.27" y2="236" stroke="#7b8791" stroke-width="2" />
<text x="1050.27" y="259" font-size="18" fill="#526675" text-anchor="middle" font-weight="400" >1</text>
<line x1="1126.41" y1="230" x2="1126.41" y2="236" stroke="#7b8791" stroke-width="2" />
<text x="1126.41" y="259" font-size="18" fill="#526675" text-anchor="middle" font-weight="400" >1.5</text>
<line x1="1202.55" y1="230" x2="1202.55" y2="236" stroke="#7b8791" stroke-width="2" />
<text x="1202.55" y="259" font-size="18" fill="#526675" text-anchor="middle" font-weight="400" >2</text>
<text x="18" y="381" font-size="23" fill="#147469" text-anchor="start" font-weight="600" >有异常过程的加权截尾等待：78.16 → 49.69秒；资格、预约、完整重访违规均为0。</text>
<text x="18" y="419" font-size="21" fill="#526675" text-anchor="start" font-weight="400" >净增点的横线为探索性95%自举区间；代价按过程求均值。以上门槛是研究决策约定，不是现场运行标准。</text>
</svg>
