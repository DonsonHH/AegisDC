<line x1="711.636" y1="230" x2="711.636" y2="236" stroke="#7b8791" stroke-width="2" />
<text x="711.636" y="259" font-size="18" fill="#526675" text-anchor="middle" font-weight="400" >4</text>
<line x1="772.545" y1="230" x2="772.545" y2="236" stroke="#7b8791" stroke-width="2" />
