<text x="448" y="115" font-size="26" fill="#172d3b" text-anchor="start" font-weight="600" >移动距离增加</text>
<text x="448" y="151" font-size="21" fill="#526675" text-anchor="start" font-weight="400" >%，越低越好</text>
<line x1="468" y1="230" x2="803" y2="230" stroke="#dce4e9" stroke-width="2" />
<line x1="772.545" y1="178" x2="772.545" y2="241" stroke="#b27420" stroke-width="2" stroke-dasharray="5 4"/>
