<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 615" role="img" aria-labelledby="coupled-model-title coupled-model-description" data-chart="coupled-model">
<title id="coupled-model-title">供电、一次／二次液冷和设备自控的耦合</title>
<desc id="coupled-model-description">电气以容量和损耗代理连接10kV、380VAC、整流与54VDC机柜。冷却塔、一次泵、CDU、二次泵和冷板构成两套回路。温度反馈调节泵、风机和功率。</desc>
<style>svg text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}svg{background:white}</style>
<text x="18" y="30" font-size="28" fill="#2369a5" text-anchor="start" font-weight="650" >供电把能量送入机柜，也约束冷却设备的可用功率</text>
<rect x="20" y="56" width="180" height="72" fill="#f2f6f9" rx="3"/>
<text x="110" y="87" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >10 kV入口</text>
<text x="110" y="116" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >电气拓扑标签</text>
<line x1="205" y1="92" x2="240" y2="92" stroke="#2369a5" stroke-width="2" /><path d="M232,97 L240,92 L232,87" fill="none" stroke="#2369a5" stroke-width="2"/>
<rect x="250" y="56" width="180" height="72" fill="#f2f6f9" rx="3"/>
<text x="340" y="87" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >变压／380 V AC</text>
<text x="340" y="116" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >容量、效率与损耗代理</text>
<line x1="435" y1="92" x2="470" y2="92" stroke="#2369a5" stroke-width="2" /><path d="M462,97 L470,92 L462,87" fill="none" stroke="#2369a5" stroke-width="2"/>
<rect x="480" y="56" width="200" height="72" fill="#f2f6f9" rx="3"/>
<text x="580" y="87" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >UPS／整流</text>
<text x="580" y="116" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >固定转换效率代理</text>
<line x1="685" y1="92" x2="720" y2="92" stroke="#2369a5" stroke-width="2" /><path d="M712,97 L720,92 L712,87" fill="none" stroke="#2369a5" stroke-width="2"/>
<rect x="730" y="56" width="180" height="72" fill="#f2f6f9" rx="3"/>
<text x="820" y="87" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >54 V DC</text>
<text x="820" y="116" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >机柜侧电压标签</text>
<line x1="915" y1="92" x2="960" y2="92" stroke="#2369a5" stroke-width="2" /><path d="M952,97 L960,92 L952,87" fill="none" stroke="#2369a5" stroke-width="2"/>
<rect x="970" y="56" width="270" height="72" fill="#f2f6f9" rx="3"/>
<text x="1105" y="87" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >128个算力机柜</text>
<text x="1105" y="116" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >IT功率转化为热</text>
<text x="18" y="190" font-size="28" fill="#147469" text-anchor="start" font-weight="650" >液冷：两套循环通过CDU换热，冷却液不直接混为一股</text>
<text x="18" y="226" font-size="21" fill="#526675" text-anchor="start" font-weight="400" >CDU是冷却液分配／换热单元；本模型每8柜为一组，共16组。</text>
<rect x="20" y="255" width="180" height="72" fill="#f2f6f9" rx="3"/>
<text x="110" y="286" font-size="25" fill="#147469" text-anchor="middle" font-weight="600" >冷却塔</text>
<text x="110" y="315" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >设施排热端</text>
<rect x="260" y="255" width="180" height="72" fill="#f2f6f9" rx="3"/>
<text x="350" y="286" font-size="25" fill="#147469" text-anchor="middle" font-weight="600" >一次循环泵</text>
<text x="350" y="315" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >共享一次回路</text>
<rect x="510" y="239" width="270" height="107" fill="#eef6f4" rx="3"/>
<text x="645" y="269" font-size="28" fill="#147469" text-anchor="middle" font-weight="650" >CDU</text>
<line x1="645" y1="278" x2="645" y2="337" stroke="#147469" stroke-width="2" />
<text x="576" y="306" font-size="23" fill="#147469" text-anchor="middle" font-weight="400" >一次侧</text>
<text x="713" y="306" font-size="23" fill="#147469" text-anchor="middle" font-weight="400" >二次侧</text>
<line x1="704" y1="328" x2="591" y2="328" stroke="#b27420" stroke-width="2" /><path d="M599,323 L591,328 L599,333" fill="none" stroke="#b27420" stroke-width="2"/>
<text x="645" y="371" font-size="20" fill="#b27420" text-anchor="middle" font-weight="400" >热量由二次侧传向一次侧</text>
<rect x="835" y="255" width="180" height="72" fill="#f2f6f9" rx="3"/>
<text x="925" y="286" font-size="25" fill="#147469" text-anchor="middle" font-weight="600" >二次循环泵</text>
<text x="925" y="315" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >各组局部回路</text>
<rect x="1060" y="255" width="180" height="72" fill="#f2f6f9" rx="3"/>
<text x="1150" y="286" font-size="25" fill="#147469" text-anchor="middle" font-weight="600" >机柜冷板</text>
<text x="1150" y="315" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >设备到液体的换热</text>
<line x1="205" y1="290" x2="250" y2="290" stroke="#147469" stroke-width="2" /><path d="M242,295 L250,290 L242,285" fill="none" stroke="#147469" stroke-width="2"/>
<line x1="445" y1="290" x2="500" y2="290" stroke="#147469" stroke-width="2" /><path d="M492,295 L500,290 L492,285" fill="none" stroke="#147469" stroke-width="2"/>
<line x1="785" y1="290" x2="825" y2="290" stroke="#147469" stroke-width="2" /><path d="M817,295 L825,290 L817,285" fill="none" stroke="#147469" stroke-width="2"/>
<line x1="1020" y1="290" x2="1050" y2="290" stroke="#147469" stroke-width="2" /><path d="M1042,295 L1050,290 L1042,285" fill="none" stroke="#147469" stroke-width="2"/>
<path d="M575,346 V405 H110 V327" fill="none" stroke="#147469" stroke-width="2"/>
<path d="M1150,327 V425 H714 V346" fill="none" stroke="#147469" stroke-width="2"/>
<text x="285" y="398" font-size="20" fill="#147469" text-anchor="middle" font-weight="400" >一次回水</text>
<text x="965" y="418" font-size="20" fill="#147469" text-anchor="middle" font-weight="400" >二次回水</text>
<line x1="1100" y1="128" x2="1100" y2="246" stroke="#b27420" stroke-width="3" />
<text x="1120" y="203" font-size="21" fill="#b27420" text-anchor="start" font-weight="400" >发热</text>
<path d="M340,128 V155 H925 V250" fill="none" stroke="#2369a5" stroke-width="2" stroke-dasharray="5 4"/>
<text x="670" y="142" font-size="20" fill="#2369a5" text-anchor="middle" font-weight="400" >辅助供电可用性影响二次泵</text>
<text x="18" y="483" font-size="27" fill="#147469" text-anchor="start" font-weight="650" >设备自控回路</text>
<text x="18" y="518" font-size="23" fill="#526675" text-anchor="start" font-weight="400" >温度等状态</text>
<line x1="183" y1="510" x2="250" y2="510" stroke="#147469" stroke-width="2" /><path d="M242,515 L250,510 L242,505" fill="none" stroke="#147469" stroke-width="2"/>
<rect x="265" y="478" width="465" height="72" fill="#f2f6f9" rx="3"/>
<text x="497.5" y="509" font-size="25" fill="#147469" text-anchor="middle" font-weight="600" >局部温度反馈＋指令滞后</text>
<text x="497.5" y="538" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >调节二次泵、塔风机与机柜限功率</text>
<line x1="735" y1="510" x2="800" y2="510" stroke="#147469" stroke-width="2" /><path d="M792,515 L800,510 L792,505" fill="none" stroke="#147469" stroke-width="2"/>
<text x="825" y="518" font-size="23" fill="#147469" text-anchor="start" font-weight="400" >改变流量、排热与发热，再影响温度</text>
<text x="18" y="590" font-size="21" fill="#526675" text-anchor="start" font-weight="400" >这是合成降阶依赖图；电气暂态、真实管网和工业控制条款未被完整复建。</text>
</svg>
