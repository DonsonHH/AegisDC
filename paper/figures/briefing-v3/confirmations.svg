<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 765 400" role="img" aria-labelledby="confirmations-title confirmations-description" data-chart="confirmations">
<title id="confirmations-title">固定巡回28、事件响应70、位置打乱25段确认</title>
<desc id="confirmations-description">三种方法都在同12个预定合成主过程中比较，异常分母均为89段。</desc>
<style>svg text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}svg{background:white}</style>
<text x="25" y="34" font-size="29" fill="#172d3b" text-anchor="start" font-weight="650" >确认了多少段异常？</text>
<line x1="82" y1="310" x2="740" y2="310" stroke="#dce4e9" stroke-width="2" />
<text x="65" y="317" font-size="19" fill="#526675" text-anchor="end" font-weight="400" >0</text>
<line x1="82" y1="240.899" x2="740" y2="240.899" stroke="#dce4e9" stroke-width="2" />
<text x="65" y="247.899" font-size="19" fill="#526675" text-anchor="end" font-weight="400" >30</text>
<line x1="82" y1="171.798" x2="740" y2="171.798" stroke="#dce4e9" stroke-width="2" />
<text x="65" y="178.798" font-size="19" fill="#526675" text-anchor="end" font-weight="400" >60</text>
<line x1="82" y1="105" x2="740" y2="105" stroke="#dce4e9" stroke-width="2" />
<text x="65" y="112" font-size="19" fill="#526675" text-anchor="end" font-weight="400" >89</text>
<g data-stage-from="0" data-stage-focus="0" data-stage-key="bar-tour"><rect x="113" y="245.506" width="124" height="64.4944" fill="#7b8791" rx="2" data-method="tour" data-count="28" data-denominator="89"/><text x="175" y="227.506" font-size="43" fill="#7b8791" text-anchor="middle" font-weight="650" >28/89</text><text x="175" y="348" font-size="25" fill="#172d3b" text-anchor="middle" font-weight="600" >固定巡回</text><text x="175" y="379" font-size="21" fill="#526675" text-anchor="middle" font-weight="400" >Tour</text></g>
<g data-stage-from="1" data-stage-focus="1" data-stage-key="bar-fifo"><rect x="338" y="148.764" width="124" height="161.236" fill="#2369a5" rx="2" data-method="fifo" data-count="70" data-denominator="89"/><text x="400" y="130.764" font-size="43" fill="#2369a5" text-anchor="middle" font-weight="650" >70/89</text><text x="400" y="348" font-size="25" fill="#172d3b" text-anchor="middle" font-weight="600" >事件响应</text><text x="400" y="379" font-size="21" fill="#526675" text-anchor="middle" font-weight="400" >FIFO</text></g>
<g data-stage-from="2" data-stage-focus="2" data-stage-key="bar-shuffled"><rect x="563" y="252.416" width="124" height="57.5843" fill="#b27420" rx="2" data-method="shuffled" data-count="25" data-denominator="89"/><text x="625" y="234.416" font-size="43" fill="#b27420" text-anchor="middle" font-weight="650" >25/89</text><text x="625" y="348" font-size="25" fill="#172d3b" text-anchor="middle" font-weight="600" >风险位置打乱</text><text x="625" y="379" font-size="21" fill="#526675" text-anchor="middle" font-weight="400" ></text></g>
</svg>
