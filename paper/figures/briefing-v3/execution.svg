<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 395" role="img" aria-labelledby="execution-title execution-description" data-chart="execution">
<title id="execution-title">加查X如何插入A、B、C之间</title>
<desc id="execution-description">原顺序A、B、C。风险只生成待确认X。资格、所属、预算和后续期限检查失败则保留原巡回；全部通过才可执行A、X、B、C。</desc>
<style>svg text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}svg{background:white}</style>
<defs><marker id="execution-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#526675" stroke-width="1.4"/></marker></defs>
<g data-stage-from="0" data-stage-focus="0 2" data-stage-key="insertion-original"><text x="20" y="32" font-size="28" fill="#172d3b" text-anchor="start" font-weight="650" >原定巡回：A、B、C（固定巡回 Tour）</text><rect x="70" y="58" width="155" height="60" fill="#f2f4f6" rx="4"/><text x="147" y="99" font-size="30" fill="#526675" text-anchor="middle" font-weight="650" >A</text><rect x="650" y="58" width="155" height="60" fill="#f2f4f6" rx="4"/><text x="727" y="99" font-size="30" fill="#526675" text-anchor="middle" font-weight="650" >B</text><rect x="1050" y="58" width="155" height="60" fill="#f2f4f6" rx="4"/><text x="1127" y="99" font-size="30" fill="#526675" text-anchor="middle" font-weight="650" >C</text><line x1="230" y1="88" x2="640" y2="88" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/><line x1="810" y1="88" x2="1040" y2="88" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/></g>
<g data-stage-from="1" data-stage-focus="1 2" data-stage-key="insertion-request"><text x="28" y="171" font-size="24" fill="#b27420" text-anchor="start" font-weight="600" >出现风险线索</text><line x1="202" y1="163" x2="270" y2="163" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/><text x="288" y="171" font-size="24" fill="#b27420" text-anchor="start" font-weight="600" >待确认任务X</text><text x="288" y="199" font-size="19" fill="#526675" text-anchor="start" font-weight="400" >此时尚未获准派单</text></g>
<g data-stage-from="2" data-stage-focus="2" data-stage-key="insertion-check"><line x1="465" y1="163" x2="530" y2="163" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/><rect x="545" y="137" width="360" height="72" fill="#eaf2f8" rx="4"/><text x="725" y="166" font-size="23" fill="#2369a5" text-anchor="middle" font-weight="600" >资格、所属、预算与后续期限</text><text x="725" y="196" font-size="21" fill="#526675" text-anchor="middle" font-weight="400" >加查后，原任务还来得及吗？</text><text x="942" y="160" font-size="22" fill="#526675" text-anchor="start" font-weight="400" >未通过：保持原巡回</text><text x="1062" y="194" font-size="24" fill="#526675" text-anchor="middle" font-weight="400" >A → B → C</text></g>
<g data-stage-from="3" data-stage-focus="3" data-stage-key="insertion-approved"><text x="20" y="255" font-size="26" fill="#2369a5" text-anchor="start" font-weight="650" >全部检查通过，才允许插入（合法事件先到先处理，FIFO）</text><rect x="70" y="280" width="155" height="62" fill="#eaf2f8" rx="4"/><text x="147" y="322" font-size="28" fill="#2369a5" text-anchor="middle" font-weight="650" >A</text><rect x="360" y="280" width="155" height="62" fill="#fff2dc" rx="4"/><text x="437" y="322" font-size="28" fill="#2369a5" text-anchor="middle" font-weight="650" >确认X</text><rect x="650" y="280" width="155" height="62" fill="#eaf2f8" rx="4"/><text x="727" y="322" font-size="28" fill="#2369a5" text-anchor="middle" font-weight="650" >B</text><rect x="1050" y="280" width="155" height="62" fill="#eaf2f8" rx="4"/><text x="1127" y="322" font-size="28" fill="#2369a5" text-anchor="middle" font-weight="650" >C</text><line x1="230" y1="311" x2="350" y2="311" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/><line x1="520" y1="311" x2="640" y2="311" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/><line x1="810" y1="311" x2="1040" y2="311" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/><text x="638" y="380" font-size="21" fill="#526675" text-anchor="middle" font-weight="400" >原任务A、B、C继续保留。字母仅示意顺序，不对应实验编号。</text></g>
</svg>
