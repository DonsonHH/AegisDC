<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 735 418" role="img" aria-labelledby="missed-gap-title missed-gap-description" data-chart="missed-gap">
<title id="missed-gap-title">按时巡回仍漏掉25秒异常</title>
<desc id="missed-gap-description">645秒正常检查，680—705秒出现25秒异常，885秒再次正常检查。灰区是事后评价，不是执行时提前知道的信息。</desc>
<style>svg text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}svg{background:white}</style>
<text x="20" y="34" font-size="29" fill="#172d3b" text-anchor="start" font-weight="650" >一次异常完全落在两次检查之间</text>
<text x="20" y="70" font-size="21" fill="#526675" text-anchor="start" font-weight="400" >灰区由事后评价取得，执行时不能提前知道</text>
<line x1="65" y1="225" x2="670" y2="225" stroke="#7b8791" stroke-width="3" />
<g data-stage-from="0" data-stage-focus="0 3" data-stage-key="gap-check-645"><circle cx="98.6111" cy="225" r="9" fill="#7b8791" /><text x="98.6111" y="266" font-size="27" fill="#172d3b" text-anchor="middle" font-weight="600" >645秒</text><text x="98.6111" y="299" font-size="22" fill="#526675" text-anchor="middle" font-weight="400" >检查正常</text></g>
<g data-stage-from="2" data-stage-focus="2 3" data-stage-key="gap-check-885"><circle cx="636.389" cy="225" r="9" fill="#7b8791" /><text x="636.389" y="266" font-size="27" fill="#172d3b" text-anchor="middle" font-weight="600" >885秒</text><text x="636.389" y="299" font-size="22" fill="#526675" text-anchor="middle" font-weight="400" >检查正常</text></g>
<g data-stage-from="1" data-stage-focus="1 3" data-stage-key="gap-abnormality"><rect x="177.037" y="109" width="56.0185" height="150" fill="#e9edef" /><text x="205.046" y="102" font-size="23" fill="#b63f50" text-anchor="middle" font-weight="600" >事后异常</text><text x="205.046" y="163" font-size="22" fill="#b63f50" text-anchor="middle" font-weight="400" >680—705秒</text><text x="205.046" y="197" font-size="24" fill="#b63f50" text-anchor="middle" font-weight="600" >持续25秒</text></g>
<g data-stage-from="3" data-stage-focus="3" data-stage-key="gap-conclusion"><line x1="98.6111" y1="335" x2="636.389" y2="335" stroke="#2369a5" stroke-width="2" /><text x="367" y="374" font-size="25" fill="#2369a5" text-anchor="middle" font-weight="600" >间隔240秒 ≤ 300秒，仍漏掉25秒异常</text><text x="367" y="407" font-size="21" fill="#526675" text-anchor="middle" font-weight="400" >按时巡检与确认短时异常，需要分别评价。</text></g>
</svg>
