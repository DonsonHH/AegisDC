<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 425 418" role="img" aria-labelledby="paired-net-title paired-net-description" data-chart="paired-net">
<title id="paired-net-title">12个独立过程有11个净增、1个不变</title>
<desc id="paired-net-description">纵向顺序为p00到p11，净增为FIFO确认数减Tour确认数。多条候选规则不增加独立过程数。</desc>
<style>svg text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}svg{background:white}</style>
<text x="15" y="34" font-size="27" fill="#172d3b" text-anchor="start" font-weight="650" >每个独立过程的净增</text>
<text x="18" y="77" font-size="20" fill="#526675" text-anchor="start" font-weight="400" >过程01</text>
<rect x="100" y="61" width="105" height="16" fill="#147469" rx="2" data-case="p00-coupled" data-net="3"/>
<text x="217" y="77" font-size="21" fill="#147469" text-anchor="start" font-weight="600" >+3</text>
<text x="18" y="102.5" font-size="20" fill="#526675" text-anchor="start" font-weight="400" >过程02</text>
<rect x="100" y="86.5" width="245" height="16" fill="#147469" rx="2" data-case="p01-coupled" data-net="7"/>
<text x="357" y="102.5" font-size="21" fill="#147469" text-anchor="start" font-weight="600" >+7</text>
<text x="18" y="128" font-size="20" fill="#526675" text-anchor="start" font-weight="400" >过程03</text>
<rect x="100" y="112" width="105" height="16" fill="#147469" rx="2" data-case="p02-coupled" data-net="3"/>
<text x="217" y="128" font-size="21" fill="#147469" text-anchor="start" font-weight="600" >+3</text>
<text x="18" y="153.5" font-size="20" fill="#526675" text-anchor="start" font-weight="400" >过程04</text>
<rect x="100" y="137.5" width="175" height="16" fill="#147469" rx="2" data-case="p03-coupled" data-net="5"/>
<text x="287" y="153.5" font-size="21" fill="#147469" text-anchor="start" font-weight="600" >+5</text>
<text x="18" y="179" font-size="20" fill="#526675" text-anchor="start" font-weight="400" >过程05</text>
<rect x="100" y="163" width="70" height="16" fill="#147469" rx="2" data-case="p04-coupled" data-net="2"/>
<text x="182" y="179" font-size="21" fill="#147469" text-anchor="start" font-weight="600" >+2</text>
<text x="18" y="204.5" font-size="20" fill="#526675" text-anchor="start" font-weight="400" >过程06</text>
<rect x="100" y="188.5" width="175" height="16" fill="#147469" rx="2" data-case="p05-coupled" data-net="5"/>
<text x="287" y="204.5" font-size="21" fill="#147469" text-anchor="start" font-weight="600" >+5</text>
<text x="18" y="230" font-size="20" fill="#526675" text-anchor="start" font-weight="400" >过程07</text>
<rect x="100" y="214" width="140" height="16" fill="#147469" rx="2" data-case="p06-coupled" data-net="4"/>
<text x="252" y="230" font-size="21" fill="#147469" text-anchor="start" font-weight="600" >+4</text>
<text x="18" y="255.5" font-size="20" fill="#526675" text-anchor="start" font-weight="400" >过程08</text>
<rect x="100" y="239.5" width="175" height="16" fill="#147469" rx="2" data-case="p07-coupled" data-net="5"/>
<text x="287" y="255.5" font-size="21" fill="#147469" text-anchor="start" font-weight="600" >+5</text>
<text x="18" y="281" font-size="20" fill="#526675" text-anchor="start" font-weight="400" >过程09</text>
<rect x="100" y="265" width="35" height="16" fill="#147469" rx="2" data-case="p08-coupled" data-net="1"/>
<text x="147" y="281" font-size="21" fill="#147469" text-anchor="start" font-weight="600" >+1</text>
<text x="18" y="306.5" font-size="20" fill="#526675" text-anchor="start" font-weight="400" >过程10</text>
<rect x="100" y="290.5" width="140" height="16" fill="#147469" rx="2" data-case="p09-coupled" data-net="4"/>
<text x="252" y="306.5" font-size="21" fill="#147469" text-anchor="start" font-weight="600" >+4</text>
<text x="18" y="332" font-size="20" fill="#526675" text-anchor="start" font-weight="400" >过程11</text>
<rect x="100" y="316" width="105" height="16" fill="#147469" rx="2" data-case="p10-coupled" data-net="3"/>
<text x="217" y="332" font-size="21" fill="#147469" text-anchor="start" font-weight="600" >+3</text>
<text x="18" y="357.5" font-size="20" fill="#526675" text-anchor="start" font-weight="400" >过程12</text>
<rect x="100" y="341.5" width="0" height="16" fill="#147469" rx="2" data-case="p11-coupled" data-net="0"/>
<text x="112" y="357.5" font-size="21" fill="#147469" text-anchor="start" font-weight="600" >0</text>
<circle cx="100" cy="349.5" r="3" fill="#7b8791" />
<text x="15" y="397" font-size="23" fill="#147469" text-anchor="start" font-weight="600" >11个净增，1个不变</text>
</svg>
