<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 395" role="img" aria-labelledby="execution-title execution-description" data-chart="execution">
<title id="execution-title">固定巡回与事件响应的执行架构</title>
<desc id="execution-description">公开线索建立待确认任务。核对资格、所属、预约、预算及后续巡回可行性，通过才额外检查，原例行义务继续保留。</desc>
<style>svg text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}svg{background:white}</style>
<defs><marker id="execution-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#526675" stroke-width="1.4"/></marker></defs>
<text x="15" y="36" font-size="29" fill="#172d3b" text-anchor="start" font-weight="650" >原来：按既定顺序循环检查（固定巡回 Tour）</text>
<rect x="55" y="61" width="227" height="65" fill="#f2f4f6" rx="4"/>
<text x="168" y="103" font-size="27" fill="#526675" text-anchor="middle" font-weight="400" >原定检查</text>
<line x1="291" y1="94" x2="345" y2="94" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/>
<rect x="355" y="61" width="227" height="65" fill="#f2f4f6" rx="4"/>
<text x="468" y="103" font-size="27" fill="#526675" text-anchor="middle" font-weight="400" >下一项检查</text>
<line x1="591" y1="94" x2="645" y2="94" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/>
<rect x="655" y="61" width="227" height="65" fill="#f2f4f6" rx="4"/>
<text x="768" y="103" font-size="27" fill="#526675" text-anchor="middle" font-weight="400" >后续检查</text>
<line x1="891" y1="94" x2="945" y2="94" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/>
<rect x="955" y="61" width="227" height="65" fill="#f2f4f6" rx="4"/>
<text x="1068" y="103" font-size="27" fill="#526675" text-anchor="middle" font-weight="400" >下一轮巡回</text>
<text x="15" y="184" font-size="29" fill="#2369a5" text-anchor="start" font-weight="650" >现在：有提示就申请加查，合法事件先到先处理（FIFO）</text>
<rect x="15" y="211" width="203" height="91" fill="#eaf2f8" rx="4"/>
<text x="116.5" y="247" font-size="24" fill="#2369a5" text-anchor="middle" font-weight="600" >公开风险提示</text>
<text x="116.5" y="281" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >当时可见的信息</text>
<line x1="222" y1="256" x2="245" y2="256" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/>
<rect x="254" y="211" width="204" height="91" fill="#eaf2f8" rx="4"/>
<text x="356" y="247" font-size="24" fill="#2369a5" text-anchor="middle" font-weight="600" >记下待确认任务</text>
<text x="356" y="281" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >先提出检查请求</text>
<line x1="462" y1="256" x2="485" y2="256" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/>
<rect x="494" y="211" width="312" height="91" fill="#eaf2f8" rx="4"/>
<text x="650" y="247" font-size="24" fill="#2369a5" text-anchor="middle" font-weight="600" >核对资格与后续可行性</text>
<text x="650" y="281" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >加查后，原任务来得及吗？</text>
<line x1="810" y1="256" x2="833" y2="256" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/>
<rect x="842" y="211" width="183" height="91" fill="#eaf2f8" rx="4"/>
<text x="933.5" y="247" font-size="24" fill="#2369a5" text-anchor="middle" font-weight="600" >通过才加查</text>
<text x="933.5" y="281" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >完成一次测量</text>
<line x1="1029" y1="256" x2="1052" y2="256" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/>
<rect x="1061" y="211" width="204" height="91" fill="#eaf2f8" rx="4"/>
<text x="1163" y="247" font-size="24" fill="#2369a5" text-anchor="middle" font-weight="600" >继续原例行任务</text>
<text x="1163" y="281" font-size="20" fill="#526675" text-anchor="middle" font-weight="400" >原来的义务保留</text>
<line x1="650" y1="303" x2="650" y2="346" stroke="#526675" stroke-width="2" />
<line x1="650" y1="346" x2="1158" y2="346" stroke="#526675" stroke-width="2" marker-end="url(#execution-arrow)"/>
<text x="897" y="378" font-size="23" fill="#526675" text-anchor="middle" font-weight="400" >未通过检查：继续例行巡回</text>
</svg>
