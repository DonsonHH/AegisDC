<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 735 418" role="img" aria-labelledby="missed-gap-title missed-gap-description" data-chart="missed-gap">
<title id="missed-gap-title">按时巡回仍漏掉25秒异常</title>
<desc id="missed-gap-description">固定巡回在645.0和885.0秒正常测量，异常发生于680.0至705.0秒。灰区由事后评价取得。</desc>
<style>svg text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}svg{background:white}</style>
<text x="20" y="34" font-size="29" fill="#172d3b" text-anchor="start" font-weight="650" >一次异常完全落在两次检查之间</text>
<text x="20" y="70" font-size="21" fill="#526675" text-anchor="start" font-weight="400" >机柜17：原办法按固定顺序巡回检查</text>
<rect x="177.037" y="109" width="56.0185" height="150" fill="#e9edef" />
<text x="205.046" y="102" font-size="23" fill="#b63f50" text-anchor="middle" font-weight="600" >短时异常</text>
<line x1="65" y1="225" x2="670" y2="225" stroke="#7b8791" stroke-width="3" />
<circle cx="98.6111" cy="225" r="9" fill="#7b8791" />
<text x="98.6111" y="266" font-size="27" fill="#172d3b" text-anchor="middle" font-weight="600" >645秒</text>
<text x="98.6111" y="299" font-size="22" fill="#526675" text-anchor="middle" font-weight="400" >检查正常</text>
<circle cx="636.389" cy="225" r="9" fill="#7b8791" />
<text x="636.389" y="266" font-size="27" fill="#172d3b" text-anchor="middle" font-weight="600" >885秒</text>
<text x="636.389" y="299" font-size="22" fill="#526675" text-anchor="middle" font-weight="400" >检查正常</text>
<text x="205.046" y="163" font-size="22" fill="#b63f50" text-anchor="middle" font-weight="400" >680—705秒</text>
<text x="205.046" y="197" font-size="24" fill="#b63f50" text-anchor="middle" font-weight="600" >持续25秒</text>
<line x1="98.6111" y1="335" x2="636.389" y2="335" stroke="#2369a5" stroke-width="2" />
<text x="367" y="374" font-size="26" fill="#2369a5" text-anchor="middle" font-weight="600" >两次检查相隔240秒，仍在300秒上限内</text>
<text x="367" y="407" font-size="22" fill="#526675" text-anchor="middle" font-weight="400" >按时完成检查，仍可能错过中间的异常。</text>
</svg>
