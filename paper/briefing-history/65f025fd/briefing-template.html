<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="回应导师上次要求的自阅研究报告：三系统模型、风险热点、FIFO实际队列和原论文评价指标。">
<title>耦合设施与风险巡检 · 导师自阅报告</title>
<style>
:root{color-scheme:light;--ink:#172d3b;--muted:#526675;--blue:#2369a5;--teal:#147469;--gold:#b27420;--line:#dce4e9;--wash:#f5f8fa;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:auto;scroll-padding-top:76px}body{margin:0;background:white;color:var(--ink);font-size:18px;line-height:1.85}
article{max-width:1248px;padding:44px 34px 65px;margin:auto}h1{font-size:clamp(30px,3vw,46px);line-height:1.4;letter-spacing:-.035em;margin:0 0 12px;font-weight:650}h1+p{font-size:18px;color:var(--muted);margin:0 0 28px}h2{font-size:clamp(26px,2.1vw,34px);line-height:1.5;margin:0 0 20px;letter-spacing:-.025em}h3{font-size:24px;line-height:1.6;margin:31px 0 14px}section{padding:34px 0 42px;border-bottom:1px solid var(--line)}section:last-child{border-bottom:0}p{margin:13px 0;max-width:1100px}strong{font-weight:650}ul{padding-left:25px;margin:16px 0}li{margin:8px 0}a{color:var(--blue);text-underline-offset:3px;overflow-wrap:anywhere}a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.contents{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:5px 23px;background:white;border-block:1px solid var(--line);padding:13px 0;font-size:16px}.contents a{text-decoration:none;white-space:nowrap}.contents a:hover{text-decoration:underline}
figure{margin:24px 0;min-width:0}.figure-frame{max-width:100%;overflow-x:auto}figure svg{display:block;width:100%;height:auto}.wide-hint{display:none}figcaption{font-size:14px;line-height:1.7;color:var(--muted);margin-top:8px}.figure-pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}.figure-pair figure{margin:22px 0}.figure-pair:has([data-chart="confirmations"]){grid-template-columns:1.7fr 1fr}
.table-wrap{width:100%;margin:20px 0;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:16px;line-height:1.75}th,td{padding:13px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{background:var(--wash);font-weight:600;border-top:2px solid var(--ink)}tbody tr:last-child td{border-bottom:1px solid #aebdc7}td:first-child{font-weight:500}table a{font-weight:500}.table-wrap[data-table]{max-width:100%}
#overview>ul{font-size:19px;line-height:1.85}#overview>p:last-child{color:var(--muted)}#fifo h3{padding-top:6px}#fifo>p>strong:first-child{color:var(--blue)}#sources{font-size:16px;color:var(--muted)}#sources h2{color:var(--ink)}#sources li{margin-bottom:10px}math{font-family:"Cambria Math",serif;font-size:1.1em}
@media(min-width:1600px){body{font-size:19px}article{max-width:1320px;padding-inline:40px}table{font-size:17px}}
@media(max-width:850px){article{padding:25px 20px 45px}.contents{font-size:14px;gap:4px 16px;padding:9px 0}.figure-pair,.figure-pair:has([data-chart="confirmations"]){grid-template-columns:1fr;gap:0}h3{font-size:22px}table{font-size:15px}th,td{padding:11px 9px}section{padding-top:27px}body{font-size:17px}.wide-hint{display:block;font-size:12px;color:var(--muted)}.figure-frame svg{min-width:1000px}.figure-frame svg[data-chart="confirmations"]{min-width:700px}.figure-frame svg[data-chart="paired-net"]{min-width:380px}.figure-frame svg[data-chart="task-17"],.figure-frame svg[data-chart="task-21"]{min-width:600px}.figure-frame svg[data-chart="public-risk"],.figure-frame svg[data-chart="offline-heat"]{min-width:560px}}
@media print{@page{size:A4 portrait;margin:13mm 11mm}body{font-size:10.5pt;line-height:1.7}article{max-width:none;padding:0}.contents,.wide-hint{display:none}h1{font-size:25pt}h2{font-size:19pt;margin-top:15pt}h3{font-size:14pt}section{padding:15pt 0 18pt;border-color:#ccc}figure{break-inside:avoid;margin:15pt 0}.figure-frame{overflow:visible}.figure-frame svg{min-width:0!important}figcaption{font-size:8pt}.figure-pair{gap:12pt}.table-wrap{overflow:visible}table{font-size:9pt}thead{display:table-header-group}tr{break-inside:avoid}th,td{padding:7pt 6pt}#overview>ul{font-size:11pt}#sources{font-size:9pt}a{color:inherit;text-decoration:none}}

.case-appendix{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:30px 0 12px;padding:18px 0}
.case-appendix summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:19px}.appendix-body{padding-top:16px}
.case-appendix summary:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
@media print{h2,h3{break-after:avoid}.case-appendix::details-content{display:block!important;content-visibility:visible!important}.case-appendix summary{font-size:11pt}.appendix-body{padding-top:8pt}}
</style>
</head><body><article>{{REPORT_BODY}}</article></body>
</html>
